version: '3.8'

services:
  marketing:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: always

  hrms:
    build: ./hrms-portal
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hrms_portal?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      APP_URL: http://localhost:3000
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hrms_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
